<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowDesk</title>
<style>
:root{--bg:#e8ebef;--panel:#f5f6f8;--border:#b9c0c8;--text:#1d232a;--accent:#2b6cb0;--sel:#cfe0f5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:12px "Segoe UI",-apple-system,system-ui,sans-serif;color:var(--text);background:var(--bg);overflow:hidden;user-select:none}
#app{display:grid;grid-template-rows:24px 34px 1fr 22px;height:100vh}
#menubar{display:flex;background:#fff;border-bottom:1px solid var(--border);align-items:stretch}
#menubar .mb{padding:4px 10px;cursor:default}
#menubar .mb:hover,#menubar .mb.open{background:#dde7f3}
#menubar .brand{margin-left:auto;padding:4px 12px;color:#6b7785;font-weight:600}
#toolbar{display:flex;align-items:center;gap:2px;padding:3px 6px;background:var(--panel);border-bottom:1px solid var(--border)}
.tb{width:28px;height:26px;border:1px solid transparent;border-radius:3px;background:none;display:grid;place-items:center;cursor:pointer;padding:0;color:#333}
.tb:hover{background:#e3ebf5;border-color:#b8c8dc}
.tb.on{background:var(--sel);border-color:#7ea4d1}
.tb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tsep{width:1px;height:20px;background:var(--border);margin:0 5px}
#main{display:grid;grid-template-columns:250px 1fr;min-height:0}
#side{display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--panel);min-height:0}
.sect{border-bottom:1px solid var(--border);padding:6px 8px}
.sect.grow{flex:1;display:flex;flex-direction:column;min-height:0;padding:0}
.sh{font-weight:600;color:#3a4552;padding:4px 0;display:flex;align-items:center;gap:4px}
.sect.grow .sh{padding:6px 8px;border-bottom:1px solid #d7dce2}
.sh .sp{flex:1}
.sbtn{border:1px solid #b8c2cc;background:#fff;border-radius:3px;padding:2px 7px;font:inherit;cursor:pointer}
.sbtn:hover{background:#eef3f9}
#info table{width:100%;border-collapse:collapse}
#info td{padding:1px 0;vertical-align:top}
#info td:first-child{color:#5a6573;width:84px}
#info td:last-child{word-break:break-all}
#tubes{overflow:auto;flex:1;background:#fff}
.trow{display:grid;grid-template-columns:14px 1fr auto;gap:6px;align-items:center;padding:4px 8px;border-bottom:1px solid #eef0f3;cursor:pointer}
.trow:hover{background:#f1f5fa}
.trow.on{background:var(--sel)}
.trow .dot{width:10px;height:10px;border-radius:50%;background:#2a9fd6}
.trow .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .ts{color:#6b7785;font-size:11px}
#ws{position:relative;overflow:auto;background:#fff}
#wsInner{position:relative;min-width:100%;min-height:100%}
#empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#empty .card{pointer-events:auto;text-align:center;border:2px dashed #c3ccd6;border-radius:10px;padding:28px 40px;color:#55606d;background:#fafbfc}
#empty .card h2{margin:0 0 6px;font-size:18px;color:#2c3540}
#empty .card p{margin:4px 0 14px}
#empty button{margin:0 4px;padding:6px 14px;font:inherit;border-radius:4px;border:1px solid #8aa6c7;background:#fff;cursor:pointer}
#empty button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
body.drag #ws{outline:3px dashed var(--accent);outline-offset:-6px}
.win{position:absolute;background:#fff;border:1px solid #a5afba;box-shadow:0 1px 3px rgba(0,0,0,.12);display:flex;flex-direction:column}
.win.active{border-color:#4a7fc1;box-shadow:0 1px 6px rgba(43,108,176,.35)}
.wt{height:20px;flex:none;display:flex;align-items:center;justify-content:center;background:#f0f2f5;border-bottom:1px solid #d5dbe2;cursor:move;position:relative;font-size:11.5px;padding:0 36px}
.wtt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.wtt:hover{text-decoration:underline}
.wx{position:absolute;right:3px;top:3px;width:13px;height:13px;border:1px solid #c33;background:#fff;color:#c33;font-size:11px;line-height:9px;padding:0;cursor:pointer}
.wx:hover{background:#c33;color:#fff}
.wb{flex:1;position:relative;min-height:0;overflow:hidden}
.rs{position:absolute;right:0;bottom:0;width:12px;height:12px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 55%,#a5afba 55%,#a5afba 62%,transparent 62%,transparent 75%,#a5afba 75%,#a5afba 82%,transparent 82%)}
.wb canvas{position:absolute;left:0;top:0}
.axl{position:absolute;font-size:11.5px;color:#111;cursor:pointer;white-space:nowrap;padding:0 3px;border-radius:2px}
.axl:hover{background:#e3ebf5;outline:1px solid #b8c8dc}
.axl.static{cursor:default}.axl.static:hover{background:none;outline:none}
.ax-x{transform:translateX(-50%)}
.ax-y{writing-mode:vertical-rl;transform:translateY(-50%) rotate(180deg)}
.tbl{overflow:auto;position:absolute;inset:0}
.tbl .hd{padding:4px 6px;color:#3a4552;border-bottom:1px solid #e1e5ea;display:flex;gap:16px;align-items:center;white-space:nowrap}
.tbl table{border-collapse:collapse;width:100%;font-size:11.5px}
.tbl th{position:sticky;top:0;background:#f0f2f5;border:1px solid #d5dbe2;padding:2px 6px;font-weight:600;text-align:left;white-space:nowrap}
.tbl td{border:1px solid #e6e9ed;padding:1px 6px;white-space:nowrap}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.sel td{background:#dbe8f7}
.tbl tr:hover td{background:#f1f5fa}
.cdot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:5px;border:1px solid rgba(0,0,0,.35);cursor:pointer}
.cdot.paint{box-shadow:0 0 0 2px #fff,0 0 0 3px currentColor}
.tw{display:inline-block;width:12px;color:#888;cursor:pointer;text-align:center}
#status{display:flex;align-items:center;gap:18px;padding:0 10px;background:var(--panel);border-top:1px solid var(--border);color:#46515e;white-space:nowrap;overflow:hidden}
#status .msg{margin-left:auto;color:#1f5f9e}
.menu{position:fixed;z-index:10000;background:#fff;border:1px solid #9aa5b1;box-shadow:2px 3px 10px rgba(0,0,0,.2);padding:3px 0;min-width:180px;max-height:80vh;overflow:auto}
.mitem{display:grid;grid-template-columns:18px 1fr auto;padding:3px 10px 3px 4px;gap:4px;cursor:default;white-space:nowrap}
.mitem:hover{background:#dde7f3}
.mitem.dis{color:#a0a8b1;pointer-events:none}
.mkey{color:#7b8591;padding-left:16px}
.mchk{text-align:center}
.msep{height:1px;background:#e1e5ea;margin:3px 0}
.mhead{padding:3px 10px;color:#7b8591;font-size:11px}
.ovl{position:fixed;inset:0;background:rgba(20,30,40,.25);z-index:20000;display:grid;place-items:center}
.dlg{background:#fff;border:1px solid #8a96a3;box-shadow:0 8px 30px rgba(0,0,0,.25);min-width:320px;max-width:90vw;max-height:88vh;display:flex;flex-direction:column}
.dlg .dt{padding:7px 12px;background:#f0f2f5;border-bottom:1px solid #d5dbe2;font-weight:600}
.dlg .db{padding:12px;overflow:auto;user-select:text}
.dlg .df{padding:8px 12px;border-top:1px solid #e1e5ea;display:flex;justify-content:flex-end;gap:6px}
.dlg button{font:inherit;padding:4px 14px;border:1px solid #b8c2cc;background:#fff;border-radius:3px;cursor:pointer}
.dlg button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.dlg input,.dlg select{font:inherit;padding:3px 5px;border:1px solid #b8c2cc;border-radius:3px}
.frm{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:center}
.mtx{border-collapse:collapse;font-size:11px}
.mtx th,.mtx td{border:1px solid #dde2e7;padding:1px 3px;text-align:center}
.mtx th{background:#f0f2f5;font-weight:600}
.mtx input{width:58px;text-align:right;border:none;padding:2px}
.mtx td.diag{background:#f3f3f3;color:#888}
.kw td{border-bottom:1px solid #eef0f3;padding:2px 8px 2px 0;vertical-align:top;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
</style>
</head>
<body>
<div id="app">
  <div id="menubar"></div>
  <div id="toolbar"></div>
  <div id="main">
    <div id="side">
      <div class="sect"><div class="sh">Sample</div><div id="info"></div></div>
      <div class="sect">
        <label style="display:flex;align-items:center;gap:6px">Events to display <span class="sp" style="flex:1"></span><input id="evDisp" list="evList" placeholder="All" style="width:84px;font:inherit;padding:2px 4px;border:1px solid #b8c2cc;border-radius:3px;text-align:right"></label>
        <datalist id="evList"><option value="All"><option value="5,000"><option value="10,000"><option value="50,000"><option value="100,000"></datalist>
      </div>
      <div class="sect">
        <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="compChk"> Apply compensation <span class="sp" style="flex:1"></span><button class="sbtn" id="compBtn">Matrix…</button></label>
      </div>
      <div class="sect grow">
        <div class="sh">Tubes <span class="sp"></span>
          <button class="sbtn" id="tOpen" title="Open FCS files">Open…</button>
          <button class="sbtn" id="tKw" title="Show FCS keywords">Keywords</button>
        </div>
        <div id="tubes"></div>
      </div>
    </div>
    <div id="ws"><div id="wsInner"></div>
      <div id="empty"><div class="card">
        <h2>No samples loaded</h2>
        <p>Drag .fcs / .lmd files here, or open them from the File menu.</p>
        <button class="pri" id="eOpen">Open FCS files…</button><button id="eDemo">Load demo data</button>
      </div></div>
    </div>
  </div>
  <div id="status"><span id="stTube">—</span><span id="stXY"></span><span class="msg" id="stMsg"></span></div>
</div>
<input type="file" id="fileIn" accept=".fcs,.lmd,.FCS,.LMD" multiple hidden>
<input type="file" id="expIn" accept=".json" hidden>
<input type="color" id="colorIn" hidden>
<script>
'use strict';
// ============================================================ utils
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (k === 'style') e.style.cssText = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) e.append(c);
  return e;
}
let _uid = 0;
const uid = p => p + Date.now().toString(36).slice(-5) + (_uid++).toString(36);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const trimZ = s => s.replace(/\.0+$|(\.\d*?)0+$/, '$1');
function fmtNum(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return trimZ((v / 1e6).toFixed(a >= 1e7 ? 0 : 1)) + 'M';
  if (a >= 1e3) return trimZ((v / 1e3).toFixed(a >= 1e4 ? 0 : 1)) + 'K';
  if (a === 0) return '0';
  return trimZ(v.toFixed(a < 1 ? 3 : a < 10 ? 2 : a < 100 ? 1 : 0));
}
function fmtVal(v) {
  if (!isFinite(v)) return '—';
  const a = Math.abs(v);
  if (a >= 1e5) return v.toExponential(2);
  return trimZ(v.toFixed(a < 10 ? 3 : a < 1000 ? 2 : 1));
}
const pct = (a, b) => b > 0 ? (a / b * 100).toFixed(2) + '%' : '—';
function niceStep(x) {
  const p = Math.pow(10, Math.floor(Math.log10(x))), r = x / p;
  return (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * p;
}
function download(name, data, type = 'application/octet-stream') {
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  const a = el('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
let msgTimer;
function msg(s) { const m = $('#stMsg'); m.textContent = s; clearTimeout(msgTimer); msgTimer = setTimeout(() => m.textContent = '', 5000); }

// ============================================================ FCS reader
function readAscii(u8, a, b) { let s = ''; for (let i = a; i < b && i < u8.length; i++) s += String.fromCharCode(u8[i]); return s; }
function parseText(t) {
  const d = t[0], kw = {}, tok = [];
  let cur = '';
  for (let i = 1; i < t.length; i++) {
    const c = t[i];
    if (c === d) {
      if (t[i + 1] === d) { cur += d; i++; } else { tok.push(cur); cur = ''; }
    } else cur += c;
  }
  if (cur.trim().length) tok.push(cur);
  for (let i = 0; i + 1 < tok.length; i += 2) kw[tok[i].trim().toUpperCase()] = tok[i + 1];
  return kw;
}
function parseDataset(buf, u8, off) {
  const hdr = readAscii(u8, off, off + 58);
  if (!/^FCS\d\.\d/.test(hdr)) throw new Error('Not an FCS file (header missing)');
  const n = (a, b) => parseInt(hdr.slice(a, b).trim() || '0', 10) || 0;
  const ts = n(10, 18), te = n(18, 26);
  let ds = n(26, 34), de = n(34, 42);
  const kw = parseText(new TextDecoder('utf-8').decode(u8.subarray(off + ts, off + te + 1)));
  kw['FCSVERSION'] = hdr.slice(0, 6);
  if (!ds || !de) { ds = parseInt(kw['$BEGINDATA'] || '0', 10); de = parseInt(kw['$ENDDATA'] || '0', 10); }
  const npar = parseInt(kw['$PAR'], 10);
  if (!(npar > 0)) throw new Error('$PAR missing');
  let ntot = parseInt(kw['$TOT'] || '0', 10) || Infinity;
  const dtype = (kw['$DATATYPE'] || 'F').trim().toUpperCase();
  if ((kw['$MODE'] || 'L').trim().toUpperCase() !== 'L') throw new Error('Only list-mode ($MODE=L) data is supported');
  const little = (kw['$BYTEORD'] || '1,2,3,4').trim().startsWith('1');
  const params = [];
  for (let p = 1; p <= npar; p++) {
    params.push({
      name: (kw[`$P${p}N`] || `P${p}`).trim(),
      stain: (kw[`$P${p}S`] || '').trim(),
      bits: parseInt(kw[`$P${p}B`] || '32', 10),
      R: parseFloat(kw[`$P${p}R`] || '0') || 0,
      E: (kw[`$P${p}E`] || '0,0').split(',').map(Number),
      G: parseFloat(kw[`$P${p}G`] || '1') || 1,
    });
  }
  const start = off + ds, end = Math.min(off + de + 1, u8.length), len = Math.max(0, end - start);
  const dv = new DataView(buf, start, len);
  const cols = [];
  if (dtype === 'F' || dtype === 'D') {
    const bw = dtype === 'F' ? 4 : 8;
    ntot = Math.min(ntot, Math.floor(len / (bw * npar)));
    for (let j = 0; j < npar; j++) cols.push(new Float32Array(ntot));
    let o = 0;
    if (dtype === 'F') { for (let i = 0; i < ntot; i++) for (let j = 0; j < npar; j++, o += 4) cols[j][i] = dv.getFloat32(o, little); }
    else { for (let i = 0; i < ntot; i++) for (let j = 0; j < npar; j++, o += 8) cols[j][i] = dv.getFloat64(o, little); }
  } else if (dtype === 'I') {
    const bytes = params.map(p => p.bits / 8);
    if (bytes.some(b => ![1, 2, 3, 4].includes(b))) throw new Error('Unsupported integer bit width');
    const bpe = bytes.reduce((a, b) => a + b, 0);
    ntot = Math.min(ntot, Math.floor(len / bpe));
    const mods = params.map(p => { if (p.R > 0) { const rb = Math.ceil(Math.log2(p.R)); if (rb < p.bits) return Math.pow(2, rb); } return 0; });
    for (let j = 0; j < npar; j++) cols.push(new Float32Array(ntot));
    let o = 0;
    for (let i = 0; i < ntot; i++) for (let j = 0; j < npar; j++) {
      let v; const b = bytes[j];
      if (b === 1) v = dv.getUint8(o);
      else if (b === 2) v = dv.getUint16(o, little);
      else if (b === 4) v = dv.getUint32(o, little);
      else v = little ? dv.getUint8(o) | dv.getUint8(o + 1) << 8 | dv.getUint8(o + 2) << 16 : dv.getUint8(o) << 16 | dv.getUint8(o + 1) << 8 | dv.getUint8(o + 2);
      o += b;
      if (mods[j]) v = v % mods[j];
      const p = params[j];
      if (p.E[0] > 0) v = (p.E[1] || 1) * Math.pow(10, p.E[0] * v / (p.R || 1));
      else if (p.G !== 1) v = v / p.G;
      cols[j][i] = v;
    }
  } else throw new Error(`$DATATYPE=${dtype} is not supported`);
  return { kw, params, cols, n: ntot, dtype };
}
function parseSpill(kw, params) {
  const s = kw['$SPILLOVER'] || kw['SPILL'] || kw['SPILLOVER'] || kw['$COMP'];
  if (!s) return null;
  const a = s.split(',').map(x => x.trim());
  const n = parseInt(a[0], 10);
  if (!(n > 0) || a.length < 1 + n + n * n) return null;
  let names = a.slice(1, 1 + n);
  if (names.every(x => /^\d+$/.test(x))) names = names.map(x => params[+x - 1] ? params[+x - 1].name : x);
  const v = a.slice(1 + n, 1 + n + n * n).map(Number), m = [];
  for (let i = 0; i < n; i++) m.push(v.slice(i * n, i * n + n));
  if (!names.every(nm => params.some(p => p.name === nm))) return null;
  return { names, matrix: m };
}
function parseFCS(buf, fileName) {
  const u8 = new Uint8Array(buf), sets = [];
  let off = 0;
  for (let k = 0; k < 10; k++) {
    try { sets.push(parseDataset(buf, u8, off)); } catch (e) { if (!sets.length) throw e; break; }
    const nx = parseInt(sets[sets.length - 1].kw['$NEXTDATA'] || '0', 10);
    if (!nx || off + nx >= u8.length) break;
    off += nx;
  }
  // Beckman .LMD files hold an FCS2 integer set and an FCS3 float set; prefer the float one
  const ds = sets.find(s => s.dtype === 'F' || s.dtype === 'D') || sets[0];
  const kw = ds.kw;
  const base = fileName.replace(/\.[^.]+$/, '');
  const params = ds.params.map(p => ({
    name: p.name, stain: p.stain,
    label: p.stain && p.stain !== p.name ? `${p.stain} ${p.name}` : p.name,
    range: p.E[0] > 0 && ds.dtype === 'I' ? (p.E[1] || 1) * Math.pow(10, p.E[0]) : (p.R || 262144),
  }));
  const cols = {};
  params.forEach((p, j) => cols[p.name] = ds.cols[j]);
  return {
    id: uid('t'), name: (kw['TUBE NAME'] || kw['TUBENAME'] || base).trim(), fileName, kw, params, cols, n: ds.n,
    spill: parseSpill(kw, params), comp: null, gates: [],
    sampleId: (kw['$SMNO'] || kw['SAMPLE ID'] || kw['$SRC'] || '').trim(),
    date: (kw['$DATE'] || '').trim(),
  };
}

// ============================================================ FCS writer
function buildFCS(t, ids, popName) {
  const P = t.params, np = P.length, n = ids.length, enc = new TextEncoder();
  const k = [];
  const add = (a, b) => k.push([a, String(b)]);
  add('$BYTEORD', '1,2,3,4'); add('$DATATYPE', 'F'); add('$MODE', 'L'); add('$NEXTDATA', '0');
  add('$PAR', np); add('$TOT', n);
  P.forEach((p, i) => { const j = i + 1; add(`$P${j}N`, p.name); if (p.stain) add(`$P${j}S`, p.stain); add(`$P${j}B`, 32); add(`$P${j}E`, '0,0'); add(`$P${j}R`, Math.round(p.range)); });
  for (const key of ['$CYT', '$CYTSN', '$DATE', '$BTIM', '$ETIM', '$SRC', '$SMNO', '$VOL', '$SPILLOVER', 'SPILL']) if (t.kw[key]) add(key, t.kw[key]);
  add('$FIL', `${t.name}_${popName}.fcs`); add('TUBE NAME', `${t.name} ${popName}`); add('FLOWDESK POPULATION', popName);
  const dataLen = n * np * 4, textStart = 256;
  let begin = 0, tb;
  for (let it = 0; it < 6; it++) {
    const all = [['$BEGINANALYSIS', '0'], ['$ENDANALYSIS', '0'], ['$BEGINSTEXT', '0'], ['$ENDSTEXT', '0'], ['$BEGINDATA', String(begin)], ['$ENDDATA', String(begin + dataLen - 1)], ...k];
    tb = enc.encode('/' + all.map(([a, b]) => a + '/' + b.replace(/\//g, '//')).join('/') + '/');
    const nb = textStart + tb.length;
    if (nb === begin) break;
    begin = nb;
  }
  const pad = v => String(v).padStart(8, ' ');
  const big = begin + dataLen - 1 > 99999999;
  let hdr = 'FCS3.1    ' + pad(textStart) + pad(textStart + tb.length - 1) + pad(big ? 0 : begin) + pad(big ? 0 : begin + dataLen - 1) + pad(0) + pad(0);
  hdr = hdr.padEnd(textStart, ' ');
  const data = new Float32Array(n * np);
  const C = P.map(p => t.cols[p.name]);
  for (let e = 0, o = 0; e < n; e++) { const i = ids[e]; for (let j = 0; j < np; j++) data[o++] = C[j][i]; }
  return new Blob([enc.encode(hdr), tb, data.buffer], { type: 'application/octet-stream' });
}

// ============================================================ compensation
function invert(M) {
  const n = M.length, A = M.map((r, i) => [...r, ...Array.from({ length: n }, (_, j) => i === j ? 1 : 0)]);

// ============================================================ demo data
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DEMO_P = [['FSC-A', ''], ['FSC-H', ''], ['SSC-A', ''], ['KO525-A', 'CD45'], ['APC-A750-A', 'CD3'], ['APC-A', 'CD4'], ['APC-A700-A', 'CD8'], ['PB450-A', 'CD57'], ['PC5.5-A', 'PD-1'], ['PC7-A', 'CD27'], ['ECD-A', 'CD28'], ['PE-A', 'CCR7'], ['FITC-A', 'CD45RA'], ['Time', '']];
function makeDemoTube(name, seed, n, shift = 0) {
  const R = mulberry(seed);
  const gauss = () => { let u = 0, v = 0; while (!u) u = R(); v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const pick = (...w) => { let r = R(), s = 0; for (let i = 0; i < w.length; i++) { s += w[i]; if (r < s) return i; } return w.length - 1; };
  const FL = DEMO_P.slice(3, 13).map(p => p[0]);
  const spillPairs = { 'FITC-A': { 'PE-A': 0.14 }, 'PE-A': { 'ECD-A': 0.22, 'PC5.5-A': 0.04 }, 'ECD-A': { 'PC5.5-A': 0.18 }, 'PC5.5-A': { 'PC7-A': 0.09 }, 'APC-A': { 'APC-A700-A': 0.11 }, 'APC-A700-A': { 'APC-A750-A': 0.12 }, 'PB450-A': { 'KO525-A': 0.13 } };
  const M = FL.map(a => FL.map(b => a === b ? 1 : (spillPairs[a] && spillPairs[a][b]) || 0));
  const cols = {};
  DEMO_P.forEach(([p]) => cols[p] = new Float32Array(n));
  const neg = () => Math.pow(10, 2.1 + gauss() * 0.3);
  const pos = (m, s = 0.15) => Math.pow(10, m + gauss() * s);
  const sc = (m, s) => Math.max(500, m + gauss() * s);
  const f = {};
  for (let i = 0; i < n; i++) {
    for (const k of FL) f[k] = neg();
    let fsc, ssc;
    const type = pick(0.08, 0.33, 0.10, 0.49);
    if (type === 0) { fsc = Math.abs(55e3 + gauss() * 30e3); ssc = Math.abs(40e3 + gauss() * 30e3); f['KO525-A'] = pos(2.6, 0.5); }
    else if (type === 1) { fsc = sc(470e3, 55e3); ssc = sc(500e3, 75e3); f['KO525-A'] = pos(4.3); }
    else if (type === 2) { fsc = sc(410e3, 45e3); ssc = sc(220e3, 35e3); f['KO525-A'] = pos(4.7); f['APC-A'] = pos(3.7, 0.2); }
    else {
      fsc = sc(270e3, 28e3); ssc = sc(70e3, 16e3); f['KO525-A'] = pos(5.0);
      if (R() < 0.72) {
        f['APC-A750-A'] = pos(4.9);
        const sub = pick(0.64 + shift, 0.30 - shift, 0.06);
        if (sub === 0) f['APC-A'] = pos(4.6); else if (sub === 1) f['APC-A700-A'] = pos(4.9);
        if (R() < (sub === 1 ? 0.3 : 0.03)) f['PB450-A'] = pos(4.3);
        if (R() < 0.1 + shift) f['PC5.5-A'] = pos(4.0, 0.25);
        const cc = sub === 1 ? pick(0.6, 0.1, 0.3) : pick(0.85, 0.12, 0.03);
        if (cc === 0) { f['PC7-A'] = pos(4.4); f['ECD-A'] = pos(4.3); } else if (cc === 1) f['ECD-A'] = pos(4.3);
        const mm = pick(0.3, 0.45, 0.22, 0.03);
        if (mm === 0 || mm === 1) f['PE-A'] = pos(4.2);
        if (mm === 0 || mm === 3) f['FITC-A'] = pos(4.3);
      } else { f['FITC-A'] = pos(4.0); if (R() < 0.3) f['PB450-A'] = pos(4.0); }
    }
    let fsch = fsc * (0.82 + gauss() * 0.025);
    if (R() < 0.04) { fsc *= 1.8; fsch = fsc * (0.5 + gauss() * 0.03); }
    cols['FSC-A'][i] = fsc; cols['FSC-H'][i] = fsch; cols['SSC-A'][i] = ssc;
    for (let j = 0; j < FL.length; j++) { let v = 0; for (let k = 0; k < FL.length; k++) v += f[FL[k]] * M[k][j]; cols[FL[j]][i] = v + gauss() * 60; }
    cols['Time'][i] = i / n * 600;
  }
  const params = DEMO_P.map(([p, s]) => ({ name: p, stain: s, label: s ? `${s} ${p}` : p, range: p === 'Time' ? 1024 : 1048576 }));
  const kw = { '$CYT': 'Demo cytometer', '$DATE': '03-NOV-2026', '$BTIM': '10:00:00', FCSVERSION: 'demo', '$TOT': String(n), '$PAR': String(params.length) };
  params.forEach((p, j) => { kw[`$P${j + 1}N`] = p.name; if (p.stain) kw[`$P${j + 1}S`] = p.stain; kw[`$P${j + 1}R`] = String(p.range); });
  kw['$SPILLOVER'] = [FL.length, ...FL, ...M.flat()].join(',');
  return { id: uid('t'), name, fileName: name + '.fcs', kw, params, cols, n, spill: { names: FL, matrix: M }, comp: null, gates: [], sampleId: 'DEMO-' + seed, date: kw['$DATE'] };
}

  tile: '<rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/>',
  undo: '<path d="M9 5L4 10l5 5"/><path d="M4 10h10.5a5 5 0 010 10H10"/>',
  redo: '<path d="M15 5l5 5-5 5"/><path d="M20 10H9.5a5 5 0 000 10H14"/>',
  png: '<rect x="3" y="5" width="18" height="14"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/>',
  csv: '<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 15h7M9 18h4"/>',
};
const ico = n => `<svg viewBox="0 0 24 24">${ICONS[n]}</svg>`;
function buildToolbar() {
  const tb = $('#toolbar');
  const add = (icon, title, fn, tool) => { const b = el('button', { class: 'tb', title: keyLabel(title), html: ico(icon) }); if (tool) b.dataset.tool = tool; b.onclick = fn; tb.append(b); return b; };
  const sep = () => tb.append(el('div', { class: 'tsep' }));
  add('open', 'Open FCS files (Ctrl+O)', () => openPicker());
  sep();
  add('pointer', 'Select / edit gates (V)', () => setTool('pointer'), 'pointer');
  add('rect', 'Rectangle gate (R)', () => setTool('rect'), 'rect');
  add('poly', 'Polygon gate (P)', () => setTool('poly'), 'poly');
  add('ellipse', 'Ellipse gate (E)', () => setTool('ellipse'), 'ellipse');
  add('quad', 'Quadrant gate (Q)', () => setTool('quad'), 'quad');
  add('interval', 'Interval gate for histograms (I)', () => setTool('interval'), 'interval');
  add('zoomin', 'Zoom in: drag a box on a plot (Z)', () => setTool('zoomin'), 'zoomin');
  add('zoomout', 'Zoom out: click a plot (X)', () => setTool('zoomout'), 'zoomout');
  sep();
  add('dot', 'New dot plot', () => addPlot('dot', selectedPop()));
  add('density', 'New density plot', () => addPlot('density', selectedPop()));
  add('pseudo', 'New pseudocolor plot', () => addPlot('pseudo', selectedPop()));
  add('contour', 'New contour plot', () => addPlot('contour', selectedPop()));
  add('hist', 'New histogram', () => addPlot('hist', selectedPop()));
  add('hier', 'Show/hide population hierarchy', () => togglePanel('hier')).dataset.panel = 'hier';
  add('stats', 'Show/hide statistics table', () => togglePanel('stats')).dataset.panel = 'stats';
  sep();
  add('tile', 'Arrange windows', tileWindows);
  add('undo', 'Undo (Ctrl+Z)', undo);
  add('redo', 'Redo (Ctrl+Y)', redo);
  sep();
  add('png', 'Export all plots as PNG', exportLayoutPNG);
  add('csv', 'Export statistics of all tubes (CSV)', exportCSV);
}
function selectedPop() { const g = S.gates.find(q => q.id === S.sel); return g ? popIdsOf(g)[0] : 'all'; }
const MENUS = {
  File: () => [
    { label: 'Open FCS files…', key: 'Ctrl+O', action: () => openPicker() },
    { label: 'Load demo data', action: loadDemo },
    '-',
    { label: 'Open experiment template…', action: () => $('#expIn').click() },
    { label: 'Save experiment template…', key: 'Ctrl+S', action: () => download('experiment.flowdesk.json', experimentJSON(), 'application/json') },
    '-',
    { label: 'Export statistics (all tubes, CSV)', action: exportCSV },
    { label: 'Export all plots as PNG', action: exportLayoutPNG },
    '-',
    { label: 'Remove current tube', disabled: !activeTube(), action: () => removeTube(S.active) },
    { label: 'Clear workspace (keep tubes)', action: () => { pushUndo(); S.tubes.forEach(t => t.gates = []); S.looseGates = []; S.template = null; S.plots = []; S.panels = []; rebuildWindows(); if (activeTube()) defaultLayout(); else recalc(); } },
  ],
  Edit: () => [
    { label: 'Undo', key: 'Ctrl+Z', disabled: !UNDO.length, action: undo },
    { label: 'Redo', key: 'Ctrl+Y', disabled: !REDO.length, action: redo },
    '-',
    { label: 'Delete selected gate', key: 'Del', disabled: !S.sel, action: () => deleteGate(S.sel) },
  ],
  Plot: () => [
    { label: 'New dot plot', action: () => addPlot('dot', selectedPop()) },
    { label: 'New density plot', action: () => addPlot('density', selectedPop()) },
    { label: 'New pseudocolor plot', action: () => addPlot('pseudo', selectedPop()) },
    { label: 'New contour plot', action: () => addPlot('contour', selectedPop()) },
    { label: 'New histogram', action: () => addPlot('hist', selectedPop()) },
    '-',
    { label: 'Population hierarchy', checked: S.panels.some(p => p.kind === 'hier'), action: () => togglePanel('hier') },
    { label: 'Statistics table', checked: S.panels.some(p => p.kind === 'stats'), action: () => togglePanel('stats') },
    '-',
    { label: 'Arrange windows', action: tileWindows },
  ],
  Gate: () => Object.entries(TOOLS).map(([k, v]) => ({ label: v, checked: S.tool === k, key: { pointer: 'V', rect: 'R', poly: 'P', ellipse: 'E', quad: 'Q', interval: 'I', zoomin: 'Z', zoomout: 'X' }[k], action: () => setTool(k) })),
  Compensation: () => [
    { label: 'Apply compensation', checked: S.compOn, action: () => { S.compOn = !S.compOn; $('#compChk').checked = S.compOn; recalc(); } },
    { label: 'Edit matrix…', action: compDialog },
  ],
  Tube: () => S.tubes.length ? S.tubes.map(t => ({ label: t.name, checked: t.id === S.active, action: () => selectTube(t.id) })) : [{ label: 'No tubes', disabled: true }],
  Help: () => [{ label: 'Quick guide…', action: helpDialog }],
};
function buildMenubar() {
  const mb = $('#menubar');
  for (const name in MENUS) {
    const m = el('div', { class: 'mb' }, name);
    const open = () => { closeMenus(); m.classList.add('open'); const r = m.getBoundingClientRect(); showMenu(r.left, r.bottom, MENUS[name]()); };
    m.addEventListener('pointerdown', e => { e.preventDefault(); m.classList.contains('open') ? closeMenus() : open(); });
    m.addEventListener('mouseenter', () => { if (document.querySelector('#menubar .mb.open') && !m.classList.contains('open')) open(); });
    mb.append(m);
  }
  mb.append(el('div', { class: 'brand' }, 'FlowDesk'));
}
function helpDialog() {
  dialog('Quick guide', el('div', { style: 'max-width:560px;line-height:1.55', html: `
<b>Files.</b> Drag .fcs/.lmd files onto the workspace or use File → Open. Click a tube on the left to switch; every plot and gate updates for that tube.<br>
<b>Plots.</b> Click an axis label to change its parameter (the last menu item opens scale/range). Click a plot title to choose which population it shows. Right-click a plot for type, axes, export.<br>
<b>Gates.</b> Pick a tool (R rectangle, P polygon, E ellipse, Q quadrant, I interval for histograms) and draw on a plot. The gate becomes a child of the plot's population.<br>
<b>Editing.</b> With the pointer (V) drag a gate to move it, drag its white handles to move single points, or the blue corner handles of a polygon to resize the whole gate (Shift keeps proportions, Alt scales from the centre). Double-click a gate label to rename; double-click inside a gate to open a new plot of that population. Del deletes the selected gate. Ctrl+Z / Ctrl+Y undo/redo.<br>
<b>Hierarchy & statistics.</b> Click the color dot to change a gate color; right-click for more (paint events in gate color, export population as FCS). Add Mean/Median/CV… columns in the Statistics table.<br>
<b>Templates.</b> File → Save experiment template stores gates, plots and layout; open it later and drop in new files.<br>
<b>Per-tube gates.</b> Each tube keeps its own gates. Right-click a gate → Apply to all tubes / Apply to tubes… to copy it (with its parent gates) to other samples.` }), [{ label: 'Close', primary: true }]);
}
addEventListener('keydown', e => {
  if (e.target.closest('input,select,textarea') || document.querySelector('.ovl')) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'o') { e.preventDefault(); openPicker(); return; }
  if (mod && k === 's') { e.preventDefault(); download('experiment.flowdesk.json', experimentJSON(), 'application/json'); return; }
  if (mod) return;
  if (e.key === 'Escape') { IA = null; closeMenus(); setTool('pointer'); return; }
  if (e.key === 'Enter' && IA && IA.kind === 'poly') { finishPoly(IA.w); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel) { deleteGate(S.sel); return; }
  const map = { v: 'pointer', r: 'rect', p: 'poly', e: 'ellipse', q: 'quad', i: 'interval', z: 'zoomin', x: 'zoomout' };
  if (map[k]) setTool(map[k]);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const i = S.tubes.findIndex(t => t.id === S.active), j = clamp(i + (e.key === 'ArrowDown' ? 1 : -1), 0, S.tubes.length - 1);
    if (S.tubes[j] && j !== i) { e.preventDefault(); selectTube(S.tubes[j].id); }
  }
});

// ============================================================ init
function init() {
  buildMenubar(); buildToolbar(); setTool('pointer');
  $('#fileIn').onchange = e => { openFiles([...e.target.files]); e.target.value = ''; };
  $('#expIn').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { loadExperiment(JSON.parse(await f.text())); msg('Experiment template loaded'); } catch (err) { alert(err.message); } };
  $('#tOpen').onclick = $('#eOpen').onclick = () => openPicker();
  $('#eDemo').onclick = loadDemo;
  $('#tKw').onclick = keywordsDialog;
  $('#compBtn').onclick = compDialog;
  $('#evDisp').onchange = e => { const n = parseInt(e.target.value.replace(/\D/g, ''), 10); S.maxEv = n > 0 ? n : 0; e.target.value = S.maxEv ? S.maxEv.toLocaleString() : ''; renderAll(); };
  $('#compChk').onchange = e => { S.compOn = e.target.checked; recalc(); };
  $('#tubes').addEventListener('click', e => { const r = e.target.closest('.trow'); if (r) selectTube(r.dataset.id); });
  $('#tubes').addEventListener('contextmenu', e => {
    const r = e.target.closest('.trow'); if (!r) return; e.preventDefault();
    const t = S.tubes.find(x => x.id === r.dataset.id);
    showMenu(e.clientX, e.clientY, [
      { label: 'Rename…', action: () => promptText('Rename tube', t.name, v => { if (v) { t.name = v; renderAll(); } }) },
      { label: 'Keywords…', action: () => { selectTube(t.id); keywordsDialog(); } },
      { label: 'Remove', action: () => removeTube(t.id) },
    ]);
  });
  $('#ws').addEventListener('pointerdown', e => { if (e.target.id === 'ws' || e.target.id === 'wsInner') { S.sel = null; setActiveWin(null); renderAll(); } });
  let dc = 0;
  addEventListener('dragenter', e => { e.preventDefault(); dc++; document.body.classList.add('drag'); });
  addEventListener('dragleave', () => { if (--dc <= 0) { dc = 0; document.body.classList.remove('drag'); } });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => {
    e.preventDefault(); dc = 0; document.body.classList.remove('drag');
    const files = [...e.dataTransfer.files];
    const json = files.find(f => /\.json$/i.test(f.name));
    if (json) json.text().then(s => { try { loadExperiment(JSON.parse(s)); } catch (err) { alert(err.message); } });
    const fcs = files.filter(f => !/\.json$/i.test(f.name));
    if (fcs.length) openFiles(fcs);
  });
  // start clean every launch; earlier builds kept the last layout here
  try { localStorage.removeItem('flowdesk.layout'); } catch (e) { }
  $('#compChk').checked = S.compOn;
  rebuildWindows(); recalc();
  if (window.flowdesk) {
    window.flowdesk.onOpenFile(f => {
      try { openBuffer(f.data, f.name); msg(`Loaded ${f.name}`); } catch (e) { alert(`${f.name}: ${e.message}`); }
    });
    window.flowdesk.ready();
  }
}
init();
</script>
